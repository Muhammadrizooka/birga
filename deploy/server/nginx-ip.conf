# Requests to the bare server IP (http://<ip>/), until the domains have DNS and HTTPS.
# /birga/ is the API under a prefix, e.g. http://<ip>/birga/swagger/index.html. Swagger's
# "Try it out" calls /v1/... on the same host (basePath "/"), so /v1/ is passed through too.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 6m;

    location = /birga {
        return 301 /birga/swagger/index.html;
    }

    location /birga/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
