# Requests to the bare server IP (http://<ip>/), until the domains have DNS and HTTPS.
# / is the admin dashboard (it calls /v1/ on the same host).
# /birga/ is the API under a prefix, e.g. http://<ip>/birga/swagger/index.html. Swagger's
# "Try it out" calls /v1/... on the same host (basePath "/"), so /v1/ is passed through too.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # MEDIA_MAX_SIZE is 100 MiB; a base64 upload is 4/3 of that, plus form overhead.
    client_max_body_size 140m;

    location = /birga {
        return 301 /birga/swagger/index.html;
    }

    location /birga/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    root /var/www/birga-dashboard;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
