# Public website: the static Astro build from birga-dashboard (website/dist), deployed to
# /var/www/birga-website by that repo's CI. bootstrap.sh fills in the domain; certbot adds
# HTTPS and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name {{SITE_DOMAIN}};

    root /var/www/birga-website;
    index index.html;
    error_page 404 /404.html;

    # Hashed build assets never change under the same name.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

# www goes to the bare domain.
server {
    listen 80;
    listen [::]:80;
    server_name www.{{SITE_DOMAIN}};

    return 301 https://{{SITE_DOMAIN}}$request_uri;
}
