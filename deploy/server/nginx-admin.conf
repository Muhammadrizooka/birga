# Admin dashboard: static files from the dashboard build, and /v1/ passed to the API on the
# same origin, so the dashboard needs no API address and no CORS.
server {
    listen 80;
    listen [::]:80;
    server_name {{ADMIN_DOMAIN}};

    root /var/www/birga-dashboard;
    index index.html;
    # MEDIA_MAX_SIZE is 100 MiB; a base64 upload is 4/3 of that, plus form overhead.
    client_max_body_size 140m;

    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
