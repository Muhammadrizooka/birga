# Public API for the mobile app. bootstrap.sh fills in the domain; certbot adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name {{API_DOMAIN}};

    client_max_body_size 140m;
    # Room for a 100 MiB photo upload: the backend waits for S3 before it answers.
    client_body_timeout 300s;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    # nginx's own errors answer with the API's JSON envelope too, not an HTML page.
    error_page 413 = @too_large;
    error_page 502 503 504 = @api_down;

    location @too_large {
        default_type application/json;
        return 413 '{"status":"Failure","error_code":-10,"error_note":"request body is too large, the limit is 140 MB","data":null}';
    }

    location @api_down {
        default_type application/json;
        return 503 '{"status":"Failure","error_code":-60,"error_note":"the API is not reachable right now, try again later","data":null}';
    }

    # The bare domain opens Swagger.
    location = / {
        return 302 /swagger/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
