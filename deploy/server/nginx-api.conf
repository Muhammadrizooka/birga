# Public API for the mobile app. bootstrap.sh fills in the domain; certbot adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name {{API_DOMAIN}};

    # MEDIA_MAX_SIZE is 100 MiB; a base64 upload is 4/3 of that, plus form overhead.
    client_max_body_size 140m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # an upload is sent on to S3 before the API answers
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
