basePath: /
definitions:
  domain.UserRole:
    enum:
    - user
    - admin
    - paid_user
    - unverified_user
    type: string
    x-enum-varnames:
    - UserRoleUser
    - UserRoleAdmin
    - UserRolePaidUser
    - UserRoleUnverifiedUser
  rest.BadRequestResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -11
      error_note:
        example: limit must be a positive integer
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.CompleteActivityRequest:
    properties:
      activity_id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      note:
        description: caregiver's reflection, optional
        example: Qizil rangni birinchi topdi
        type: string
    type: object
  rest.ConflictResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -40
      error_note:
        example: username is already taken
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.CreateActivityRequest:
    properties:
      description_en:
        example: Sort the stones by colour
        type: string
      description_ru:
        example: Сортируйте камни по цвету
        type: string
      description_uz:
        example: Toshlarni rangi bo'yicha saralang
        type: string
      duration_minutes:
        example: 10
        maximum: 60
        minimum: 1
        type: integer
      goal_ids:
        example:
        - 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        items:
          type: string
        type: array
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        maximum: 6
        minimum: 2
        type: integer
      min_age:
        example: 3
        maximum: 6
        minimum: 2
        type: integer
      title_en:
        example: Colourful stones
        type: string
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
    type: object
  rest.CreateChildRequest:
    properties:
      age:
        example: 4
        type: integer
      gender:
        enum:
        - male
        - female
        example: male
        type: string
      goal_ids:
        description: GoalIDs are the goals picked for this child, ids from GET /v1/goals.
        example:
        - 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        items:
          type: string
        type: array
      name:
        example: Amir
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
    type: object
  rest.CreateGoalRequest:
    properties:
      name_en:
        example: Speech development
        type: string
      name_ru:
        example: Развитие речи
        type: string
      name_uz:
        example: Nutqni rivojlantirish
        type: string
    type: object
  rest.CreateUserRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.ForbiddenResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -21
      error_note:
        example: phone number is not verified, verify a sign_up code with /v1/otp/verify
          first
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.ForgotPasswordRequest:
    properties:
      password:
        example: n3w-s3cret-pass
        type: string
      phone_number:
        example: "+998901234567"
        type: string
    type: object
  rest.InternalServerErrorResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -50
      error_note:
        example: internal error
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.LoginRequest:
    properties:
      password:
        example: s3cret-pass
        type: string
      username:
        example: dilnoza_k
        type: string
    type: object
  rest.NotFoundResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -30
      error_note:
        example: activity not found
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.R:
    properties:
      data: {}
      error_code:
        $ref: '#/definitions/rest.errCode'
      error_note:
        type: string
      status:
        $ref: '#/definitions/rest.statusType'
    type: object
  rest.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  rest.ResetPasswordRequest:
    properties:
      password:
        example: n3w-s3cret-pass
        type: string
    type: object
  rest.SendOTPRequest:
    properties:
      phone_number:
        example: "+998901234567"
        type: string
      purpose:
        enum:
        - sign_up
        - update_user
        - reset_password
        example: sign_up
        type: string
    type: object
  rest.ServiceUnavailableResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -60
      error_note:
        example: database unavailable
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.SignUpRequest:
    properties:
      agreed_on_conditions:
        description: AgreedOnConditions is the consent tick on the sign-up screen;
          omitted means false.
        example: true
        type: boolean
      name:
        example: Dilnoza
        type: string
      password:
        example: s3cret-pass
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      relationship:
        description: Relationship is who the user is to the children.
        enum:
        - father
        - mother
        - educator
        - nanny
        example: mother
        type: string
      role:
        description: Role is user (the default) or admin; admin needs the X-Admin-Key
          header.
        enum:
        - user
        - admin
        example: user
        type: string
      username:
        example: dilnoza_k
        type: string
    type: object
  rest.TooManyRequestsResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -70
      error_note:
        example: a code was sent recently, request a new one in 42 seconds
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UnauthorizedResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -20
      error_note:
        example: unauthorized
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UnprocessableContentResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -10
      error_note:
        example: unknown goal "flying"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UpdateActivityRequest:
    properties:
      description_en:
        example: Sort the stones by colour
        type: string
      description_ru:
        example: Сортируйте камни по цвету
        type: string
      description_uz:
        example: Toshlarni rangi bo'yicha saralang
        type: string
      duration_minutes:
        example: 10
        maximum: 60
        minimum: 1
        type: integer
      goal_ids:
        example:
        - 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        items:
          type: string
        type: array
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        maximum: 6
        minimum: 2
        type: integer
      min_age:
        example: 3
        maximum: 6
        minimum: 2
        type: integer
      title_en:
        example: Colourful stones
        type: string
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
    type: object
  rest.UpdateChildRequest:
    properties:
      age:
        example: 5
        type: integer
      gender:
        enum:
        - male
        - female
        example: male
        type: string
      goal_ids:
        description: 'GoalIDs, when sent, replaces the child''s goals: 1 to 20 ids
          from GET /v1/goals.'
        example:
        - 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        items:
          type: string
        type: array
      name:
        example: Amir
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
    type: object
  rest.UpdateGoalRequest:
    properties:
      name_en:
        example: Speech development
        type: string
      name_ru:
        example: Развитие речи
        type: string
      name_uz:
        example: Nutqni rivojlantirish
        type: string
    type: object
  rest.UpdateProfileRequest:
    properties:
      agreed_on_conditions:
        description: AgreedOnConditions records consent for users who signed up without
          it; only true is accepted.
        example: true
        type: boolean
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      reminder_enabled:
        description: ReminderEnabled and ReminderTime are the daily reminder setting
          (HH:MM, Uzbekistan time).
        example: true
        type: boolean
      reminder_time:
        example: "18:00"
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.UpdateUserRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.VerifyOTPRequest:
    properties:
      code:
        example: "480569"
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      purpose:
        enum:
        - sign_up
        - update_user
        - reset_password
        example: sign_up
        type: string
    type: object
  rest.accessTokenView:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: seconds until the access token expires
        example: 86400
        type: integer
    type: object
  rest.activityListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.activityView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  rest.activityView:
    properties:
      created_at:
        type: string
      description_en:
        type: string
      description_ru:
        type: string
      description_uz:
        type: string
      duration_minutes:
        example: 10
        type: integer
      goal_ids:
        example:
        - 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        items:
          type: string
        type: array
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        type: integer
      min_age:
        example: 3
        type: integer
      title_en:
        example: Colourful stones
        type: string
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
      updated_at:
        type: string
    type: object
  rest.childListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.childView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 2
        type: integer
    type: object
  rest.childView:
    properties:
      age:
        example: 4
        type: integer
      created_at:
        type: string
      gender:
        example: male
        type: string
      goal_ids:
        example:
        - 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        items:
          type: string
        type: array
      id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      name:
        example: Amir
        type: string
      photo_id:
        example: 5d2f8a90-1c3b-4e6f-8a7d-9b0c1d2e3f4a
        type: string
      updated_at:
        type: string
    type: object
  rest.completionListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.completionView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 12
        type: integer
    type: object
  rest.completionView:
    properties:
      activity_id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      child_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      completed_on:
        example: "2026-10-03"
        type: string
      created_at:
        type: string
      id:
        example: 5d2f8a90-1c3b-4e6f-8a7d-9b0c1d2e3f4a
        type: string
      note:
        example: Qizil rangni birinchi topdi
        type: string
      plan_day:
        description: |-
          PlanDay is the plan day (1..7) this completion did; null when it did not count for the plan.
          Only set on the response of POST /v1/children/{id}/completions.
        example: 3
        type: integer
      user_id:
        example: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
        type: string
    type: object
  rest.errCode:
    enum:
    - 0
    - -10
    - -11
    - -20
    - -21
    - -30
    - -40
    - -50
    - -60
    - -70
    type: integer
    x-enum-comments:
      _errCodeBadRequest: for http 400
      _errCodeConflict: for http 409
      _errCodeForbidden: for http 403
      _errCodeInternalErr: for http 500
      _errCodeNoError: Success code.
      _errCodeNotFound: for http 404
      _errCodeRateLimited: for http 429
      _errCodeUnauthorized: for http 401
      _errCodeUnavailable: for http 503
      _errCodeValidation: for http 422
    x-enum-descriptions:
    - Success code.
    - for http 422
    - for http 400
    - for http 401
    - for http 403
    - for http 404
    - for http 409
    - for http 500
    - for http 503
    - for http 429
    x-enum-varnames:
    - _errCodeNoError
    - _errCodeValidation
    - _errCodeBadRequest
    - _errCodeUnauthorized
    - _errCodeForbidden
    - _errCodeNotFound
    - _errCodeConflict
    - _errCodeInternalErr
    - _errCodeUnavailable
    - _errCodeRateLimited
  rest.goalListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.goalView'
        type: array
      total:
        example: 6
        type: integer
    type: object
  rest.goalView:
    properties:
      created_at:
        type: string
      id:
        example: 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        type: string
      name_en:
        example: Speech development
        type: string
      name_ru:
        example: Развитие речи
        type: string
      name_uz:
        example: Nutqni rivojlantirish
        type: string
      updated_at:
        type: string
    type: object
  rest.mediaView:
    properties:
      content_type:
        example: image/jpeg
        type: string
      id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      size:
        description: bytes
        example: 183244
        type: integer
      url:
        example: https://birga-staging.s3.ap-southeast-2.amazonaws.com/media/3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f.jpg
        type: string
    type: object
  rest.planDayView:
    properties:
      activity:
        $ref: '#/definitions/rest.activityView'
      completed_on:
        example: "2026-10-11"
        type: string
      day:
        example: 1
        type: integer
      goal_id:
        description: null when the child had no goals
        example: 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        type: string
      status:
        enum:
        - done
        - today
        - locked
        example: today
        type: string
    type: object
  rest.planView:
    properties:
      child_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      completed:
        example: false
        type: boolean
      days:
        items:
          $ref: '#/definitions/rest.planDayView'
        type: array
      id:
        example: 8c1e2d3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        type: string
      number:
        description: the child's plans counted from 1
        example: 1
        type: integer
      started_on:
        example: "2026-10-11"
        type: string
    type: object
  rest.profileView:
    properties:
      agreed_on_conditions:
        description: AgreedOnConditions is the consent to the terms given at sign-up.
        example: true
        type: boolean
      created_at:
        type: string
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      relationship:
        description: Relationship is null for users created before sign-up asked for
          it, or by an admin.
        enum:
        - father
        - mother
        - educator
        - nanny
        example: mother
        type: string
      reminder_enabled:
        description: ReminderEnabled and ReminderTime are the daily reminder setting
          (HH:MM, Uzbekistan time).
        example: true
        type: boolean
      reminder_time:
        example: "18:00"
        type: string
      role:
        allOf:
        - $ref: '#/definitions/domain.UserRole'
        enum:
        - unverified_user
        - user
        - paid_user
        - admin
        example: user
      updated_at:
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.sendOTPView:
    properties:
      expires_in:
        description: seconds until the code expires
        example: 180
        type: integer
      resend_in:
        description: seconds until a new code may be requested
        example: 60
        type: integer
    type: object
  rest.signUpView:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: seconds until the access token expires
        example: 86400
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
    type: object
  rest.statusType:
    enum:
    - Success
    - Failure
    type: string
    x-enum-varnames:
    - _statusSuccess
    - _statusFailure
  rest.streakDayView:
    properties:
      day:
        example: "2026-10-12"
        type: string
      status:
        enum:
        - done
        - missed
        - today
        example: done
        type: string
    type: object
  rest.streakView:
    properties:
      completed_today:
        example: true
        type: boolean
      current:
        example: 3
        type: integer
      last_completed_on:
        example: "2026-10-03"
        type: string
      longest:
        example: 7
        type: integer
      this_week:
        example: 2
        type: integer
      total:
        example: 12
        type: integer
    type: object
  rest.tokenPairView:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: seconds until the access token expires
        example: 86400
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  rest.userListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.userView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  rest.userView:
    properties:
      agreed_on_conditions:
        description: AgreedOnConditions is the consent to the terms given at sign-up.
        example: true
        type: boolean
      created_at:
        type: string
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      relationship:
        description: Relationship is null for users created before sign-up asked for
          it, or by an admin.
        enum:
        - father
        - mother
        - educator
        - nanny
        example: mother
        type: string
      reminder_enabled:
        description: ReminderEnabled and ReminderTime are the daily reminder setting
          (HH:MM, Uzbekistan time).
        example: true
        type: boolean
      reminder_time:
        example: "18:00"
        type: string
      updated_at:
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
