          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: adds a child to the signed-in user
      tags:
      - children
  /v1/children/{id}:
    get:
      description: '- only the child''s parents can read it; any other id, or a deleted
        child, is 404'
      parameters:
