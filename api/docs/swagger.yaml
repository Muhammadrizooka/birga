  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: |-
        - first POST /v1/otp/send and /v1/otp/verify with purpose reset_password for the
        user's phone number; without that verification: 403. A successful reset uses it up
        - phone_number: +998 and 9 digits; password: 8 to 72 bytes, stored as a bcrypt hash (422)
        - no user has this phone number: 404
        - returns a new token pair (the user is signed in); every token issued before stops working
      parameters:
      - description: phone number and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.tokenPairView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: sets a new password for a signed-out user, confirmed by an SMS code
      tags:
      - auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        - username is case-insensitive; username and password are required (422)
        - unknown username or wrong password: 401 with the same message, so it does not tell
        which usernames exist
        - returns a new token pair, like sign-up. Only the newest pair is valid, so signing in
        signs out every other device
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.tokenPairView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: signs a user in with username and password
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: |-
        - the access token used here and the refresh token stop working at once (401 afterwards);
        sign in again with POST /v1/auth/login
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: signs the user out
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        - refresh_token must be signed by this API, unexpired, of type refresh, and still the
        one stored for the user (a deleted user's token stops working); otherwise 401
        - the refresh token is not rotated; keep using it until it expires
      parameters:
      - description: refresh token from sign-up
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.accessTokenView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: trades a refresh token for a new access token
      tags:
      - auth
  /v1/auth/signup:
    post:
      consumes:
      - application/json
      description: |-
        - no OTP step: the phone number is not verified, so every new user gets the role
        unverified_user (stored in user_auth.role and written into the tokens as the role claim)
        - name: 1 to 100 characters; username: 3 to 32 of a-z, 0-9, '_' or '.' (lowercased);
        password: 8 to 72 bytes, stored as a bcrypt hash; phone_number: +998 and 9 digits (422)
        - relationship is required: father, mother, educator or nanny (422)
        - no goals here: goals belong to each child (POST /v1/children)
        - role is user (default, the account gets unverified_user) or admin; admin needs the
        X-Admin-Key header with ADMIN_API_KEY (401 wrong or missing key, 403 admin API disabled)
        - no profile photo here: set photo_id later with PATCH /v1/me
        - username or phone number already used: 409
        - returns the new user's user_id with the tokens
        - access_token (JWT_ACCESS_TTL, default 24 hours) and refresh_token (JWT_REFRESH_TTL,
        default 0: never expires) are HS256 JWTs; send the access token as Authorization: Bearer <token>
      parameters:
      - description: ADMIN_API_KEY; needed only with role admin
        in: header
        name: X-Admin-Key
        type: string
      - description: new user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.SignUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.signUpView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: creates a user and returns their tokens
      tags:
      - auth
  /v1/children:
    post:
      consumes:
      - application/json
      description: |-
        - creates the child profile and links it to the caller in the same transaction;
        the caller is the child's first parent
        - any signed-in role (user, paid_user, admin) may add children
        - name is required, at most 100 characters; age is required, 0..18; gender is male or female
        - photo_id is an optional id from POST /v1/media (422 if unknown)
        - goal_ids is required: 1 to 20 goal ids from GET /v1/goals, repeats stored once;
        an id that is not an active goal: 422
        - the child's first 7-day plan is made at once from its goals (GET /v1/children/{id}/plan)
      parameters:
      - description: child
        in: body
