          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: sets a new password for the signed-in user, confirmed by an SMS code
      tags:
      - me
  /v1/media:
    post:
      consumes:
      - multipart/form-data
      - application/x-www-form-urlencoded
      description: |-
        - send form data (multipart/form-data or application/x-www-form-urlencoded) with one field "file":
        either the file itself (multipart file part) or the file as a base64 string; a data URL
        prefix such as "data:image/png;base64," is allowed
        - accepted: JPEG, PNG or WebP, detected from the bytes, not from the file name (422 otherwise)
        - at most MEDIA_MAX_SIZE bytes after decoding, default 100 MiB (422 otherwise)
        - the answer's id goes into users.photo_id (PATCH /v1/admin/users/{id} {"photo_id": id});
        url is where clients load the image from
        - 503 when S3 is not configured (S3_BUCKET empty)
      parameters:
      - description: 'the image: a file part, or a base64 string in the same field'
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.mediaView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest.ServiceUnavailableResponse'
      summary: uploads an image (a profile photo) to S3
      tags:
      - media
  /v1/otp/send:
    post:
      consumes:
      - application/json
      description: |-
        - phone_number: an Uzbek mobile number in E.164, +998 and 9 digits (422 otherwise)
        - purpose: sign_up (the number must not belong to a user, 409 otherwise), update_user, or
        reset_password (the number must belong to a user, 404 otherwise; used by forgot password and
        PUT /v1/me/password)
        - the User-Agent header is required (422 if empty) and identifies the client for rate limits;
        an old client's ip_address field is ignored
        - the code has 6 digits and is sent through Play Mobile; only its hash is stored
        - the code is kept in Redis for expires_in seconds (OTP_TTL, default 2 minutes); a new
        code replaces the previous one for the same phone and purpose
        - rate limiter (429): one code per phone and purpose per resend_in seconds, and per hour
        at most OTP_MAX_PER_PHONE_HOUR codes per phone and OTP_MAX_PER_USER_AGENT_HOUR per User-Agent
      parameters:
      - description: where and why to send the code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.sendOTPView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/rest.TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: sends a one-time code by SMS
      tags:
      - otp
  /v1/otp/verify:
    post:
      consumes:
      - application/json
      description: |-
        - phone_number and purpose must be the ones the code was sent for; code is 6 digits (422)
        - a matching code is deleted, so it works only once; data is null
        - wrong code: 422 with the attempts left; after OTP_MAX_VERIFY_ATTEMPTS wrong codes the
        code is deleted and the answer is 429
        - no code (never sent, expired after 2 minutes, or already used): 404
        - OTP_DEFAULT_CODE, when configured (never in production), is accepted for any phone
        and purpose without checking
      parameters:
      - description: code to check
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/rest.TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: checks a one-time code
      tags:
      - otp
securityDefinitions:
  AdminKey:
    in: header
    name: X-Admin-Key
    type: apiKey
  BearerAuth:
    description: Access token from /v1/auth/signup or /v1/auth/refresh, as "Bearer
      <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
