        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: returns a user
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: |-
        - only the fields present in the body change; omitted or null fields are kept
        - "" clears name, username or photo_id; phone_number cannot be cleared
        - same format and uniqueness rules as create
      parameters:
      - description: user id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.UpdateUserRequest'
      produces:
