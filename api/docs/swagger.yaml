        ("" clears it, an unknown id is 422)
        - goal_ids replaces the child's goals (1 to 20 active goal ids, 422 otherwise); the
        current plan keeps its days, the next plan uses the new goals
        - an empty body is 422 (nothing to update)
      parameters:
      - description: child id (UUID)
        in: path
