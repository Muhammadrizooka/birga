        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: today's plan activity for a child
      tags:
      - children
  /v1/children/{id}/streak:
    get:
      description: |-
        - only days of the child's plan count: a day counts when a plan day was done on it;
        other activities stay in the history but do not keep the streak
        - current: consecutive such days up to today, or up to yesterday while today has none
        yet (the streak is not lost until a whole day is missed)
        - longest: the longest such run; this_week: such days since Monday; total: plan days done
        - days are counted in Uzbekistan time (UTC+5)
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.streakView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: a child's streak and progress
      tags:
      - children
  /v1/children/{id}/streak/days:
    get:
      description: |-
        - one entry per day from from to to (both inclusive, YYYY-MM-DD), oldest first, skipping
        days before the child's first plan started and days after today
        - status: done (a plan day was done), missed (no plan day done that day), today (today,
        nothing done yet: not missed until the day is over); days are Uzbekistan time (UTC+5)
        - from and to are optional: without them, the last 28 days up to today; at most 366
        days, and from must not be after to (422)
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: first day, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: last day, YYYY-MM-DD (default today)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
