        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: marks an activity done for a child today
      tags:
      - children
  /v1/children/{id}/plan:
    get:
      description: |-
        - only the child's parents can ask (404 otherwise)
        - the plan is made when the child is added (or on the first call for older children):
        seven days, each serving one of the child's goals in turn (goals A, B, C: A B C A B C A,
        the next plan starting one goal further), with an activity fitting the child's age
        (clamped to 2..6) that serves the day's goal, preferring activities serving more of the
        child's goals and ones the child has not done
        - days are done in order, at most one per calendar day (Uzbekistan time): status is done,
        today (the next day to do, open now) or locked. A missed day pauses the plan: the open
        day stays open until it is done
        - completing a day is POST /v1/children/{id}/completions with the day's activity id
        - completed is true after the last day; then POST starts the next plan
        - 404 when no published activity fits the child's age
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.planView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: a child's current 7-day plan (the Reja tab)
      tags:
      - children
    post:
      description: |-
        - only after the current plan is done (completed true): 409 otherwise
        - the new plan starts today from the child's goals as they are now; change them first
        with PATCH /v1/children/{id} if wanted. When the last day of the previous plan was done
        today, day 1 opens tomorrow
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.planView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: starts a child's next 7-day plan
      tags:
      - children
  /v1/children/{id}/recommendation:
    get:
      description: |-
        - the activity of the plan day that is open today (status today in GET
        /v1/children/{id}/plan); the first call makes the child's first plan if it has none
        - only the child's parents can ask (404 otherwise)
        - 404 no plan day open today: today's plan day is already done, or the plan is done
        (start the next one with POST /v1/children/{id}/plan); 404 also when no published
        activity fits the child's age
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
